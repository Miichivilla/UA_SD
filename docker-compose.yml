# Entorno LOCAL de pruebas (simula la parte Cloud de Railway en tu PC).
#   docker compose up -d --build          -> Kafka + WM_Central   (panel: http://localhost:3000)
# Las WS y los FO se lanzan con "docker compose run" (ver README / guía de pruebas).

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: broker
    ports:
      - "9092:9092"            # tu PC -> localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # contenedores -> kafka:29092 | tu PC -> localhost:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  central:
    build: ./WM_Central
    container_name: wm_central
    depends_on: [kafka]
    ports:
      - "5050:5050"            # sockets para WM_WS_M
      - "3000:3000"            # panel web
    environment:
      WM_PORT: "5050"
      PORT: "3000"
      KAFKA_BOOTSTRAP: kafka:29092
      WM_DB: /data/wmcentral.db
    volumes:
      - central_data:/data     # la SQLite sobrevive a reinicios del contenedor
    stdin_open: true           # "docker attach wm_central" para escribir órdenes
    tty: true

  # Imagen de las WS (monitor y engine). Se lanza con "docker compose run ws ..."
  ws:
    build: ./WM_WS
    profiles: ["lab"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      WM_CENTRAL: central:5050
      WM_DATA_DIR: /data
    volumes:
      - ws_data:/data          # el engine guarda aquí el riego en curso (resiliencia)
    stdin_open: true
    tty: true

  fo:
    build: ./WM_FO
    profiles: ["lab"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    stdin_open: true
    tty: true

volumes:
  central_data:
  ws_data:
